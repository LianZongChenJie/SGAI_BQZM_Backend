<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照明系统 Excel 导出测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    min-height: 100vh;
    padding: 32px 16px;
    color: #e2e8f0;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 {
    font-size: 24px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
  .card {
    background: rgba(30, 41, 59, 0.85);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(6px);
  }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid rgba(148, 163, 184, 0.3);
    background: rgba(15, 23, 42, 0.8);
    color: #e2e8f0;
    font-size: 13px;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  }
  .token-box { font-family: Consolas, monospace; font-size: 12px; word-break: break-all; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  .api-card {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform .2s, border-color .2s;
  }
  .api-card:hover { transform: translateY(-2px); border-color: rgba(56, 189, 248, 0.5); }
  .api-card .name { font-size: 15px; font-weight: 600; color: #f1f5f9; }
  .api-card .url { font-size: 11px; color: #64748b; font-family: Consolas, monospace; word-break: break-all; margin-bottom: 4px; }
  .api-card .params { display: flex; gap: 8px; flex-wrap: wrap; }
  .api-card .params input { width: auto; flex: 1; min-width: 90px; padding: 7px 9px; font-size: 12px; }
  .btn {
    padding: 9px 0;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    color: #fff;
    text-align: center;
  }
  .btn-primary { background: linear-gradient(90deg, #0ea5e9, #6366f1); }
  .btn-primary:hover { box-shadow: 0 4px 16px rgba(56, 189, 248, 0.35); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
  .log-card { min-height: 80px; }
  .log {
    font-family: Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    max-height: 220px;
    overflow-y: auto;
    color: #cbd5e1;
  }
  .log .ok { color: #4ade80; }
  .log .err { color: #f87171; }
  .log .info { color: #7dd3fc; }
  .status-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    margin-left: 6px;
  }
  .status-idle { background: rgba(100, 116, 139, .25); color: #94a3b8; }
  .status-loading { background: rgba(56, 189, 248, .2); color: #38bdf8; }
  .status-ok { background: rgba(74, 222, 128, .2); color: #4ade80; }
  .status-err { background: rgba(248, 113, 113, .2); color: #f87171; }
  .btn-all {
    width: 100%;
    padding: 12px 0;
    font-size: 15px;
    background: linear-gradient(90deg, #10b981, #0ea5e9);
    margin-top: 4px;
  }
  .btn-all:hover { box-shadow: 0 4px 18px rgba(16, 185, 129, .35); }
</style>
</head>
<body>
<div class="container">
  <h1>💡 照明系统 · Excel 导出测试</h1>
  <div class="sub">四个导出接口（查询条件与各自 listPage 一致，不分页导出全量）</div>

  <div class="card">
    <div class="field">
      <label>后端地址（含 context-path，默认 sgai-bqzm 前缀）</label>
      <input type="text" id="baseUrl" value="http://localhost:7010/sgai-bqzm" placeholder="http://localhost:7010/sgai-bqzm">
    </div>
    <div class="field">
      <label>Token（自动同时携带 X-Access-Token 与 Authorization 头）</label>
      <input type="text" id="token" class="token-box"
             value="eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJleHAiOjE3ODYyODA0NDAsInVzZXJuYW1lIjoiZnVkb25neHUifQ.--OlPSE9UDNwNDyFMHD7kSnRAR9QYYer9Wg4IYdHL-c">
    </div>
  </div>

  <div class="grid">
    <div class="api-card">
      <div class="name">区域列表导出<span class="status-badge status-idle" id="s1">未开始</span></div>
      <div class="url">GET /bems/lighting/area/export</div>
      <div class="params">
        <input type="text" id="p1_1" placeholder="relName 区域名">
        <input type="text" id="p1_2" placeholder="areaName">
        <input type="text" id="p1_3" placeholder="space">
        <input type="text" id="p1_4" placeholder="districtId">
      </div>
      <button class="btn btn-primary" onclick="exportExcel(1, '/bems/lighting/area/export', {relName:'p1_1',areaName:'p1_2',space:'p1_3',districtId:'p1_4'}, '区域列表')">导出</button>
    </div>

    <div class="api-card">
      <div class="name">计划列表导出<span class="status-badge status-idle" id="s2">未开始</span></div>
      <div class="url">GET /bems/lighting/plan/export</div>
      <div class="params">
        <input type="text" id="p2_1" placeholder="relType 区域/回路">
        <input type="text" id="p2_2" placeholder="startTime 如 18:00:00">
        <input type="text" id="p2_3" placeholder="endTime 如 22:00:00">
      </div>
      <button class="btn btn-primary" onclick="exportExcel(2, '/bems/lighting/plan/export', {relType:'p2_1',startTime:'p2_2',endTime:'p2_3'}, '计划列表')">导出</button>
    </div>

    <div class="api-card">
      <div class="name">场景列表导出<span class="status-badge status-idle" id="s3">未开始</span></div>
      <div class="url">GET /bems/lighting/scene/export</div>
      <div class="params">
        <input type="text" id="p3_1" placeholder="sceneName 场景名">
        <input type="text" id="p3_2" placeholder="sceneType">
        <input type="text" id="p3_3" placeholder="status 启用">
        <input type="text" id="p3_4" placeholder="groupId">
      </div>
      <button class="btn btn-primary" onclick="exportExcel(3, '/bems/lighting/scene/export', {sceneName:'p3_1',sceneType:'p3_2',status:'p3_3',groupId:'p3_4'}, '场景列表')">导出</button>
    </div>

    <div class="api-card">
      <div class="name">控制日志导出<span class="status-badge status-idle" id="s4">未开始</span></div>
      <div class="url">GET /bems/lighting/operationLog/export</div>
      <div class="params">
        <input type="text" id="p4_1" placeholder="logType 场景/定时/手动">
        <input type="text" id="p4_2" placeholder="operationType 开/关">
        <input type="text" id="p4_3" placeholder="name 名称">
        <input type="text" id="p4_4" placeholder="startTime 2026-08-01 00:00:00">
        <input type="text" id="p4_5" placeholder="endTime 2026-08-31 23:59:59">
      </div>
      <button class="btn btn-primary" onclick="exportExcel(4, '/bems/lighting/operationLog/export', {logType:'p4_1',operationType:'p4_2',name:'p4_3',startTime:'p4_4',endTime:'p4_5'}, '控制日志')">导出</button>
    </div>
  </div>

  <button class="btn btn-all" onclick="exportAll()">⬇️ 一键导出全部四个</button>

  <div class="card log-card">
    <div class="field" style="margin-bottom:8px;"><label>执行日志</label></div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
  const TOKEN_INPUT = document.getElementById('token');
  const BASE_INPUT = document.getElementById('baseUrl');
  const LOG = document.getElementById('log');

  function log(msg, cls = 'info') {
    const line = document.createElement('div');
    line.className = cls;
    const time = new Date().toLocaleTimeString();
    line.textContent = `[${time}] ${msg}`;
    LOG.appendChild(line);
    LOG.scrollTop = LOG.scrollHeight;
  }

  function setStatus(idx, text, cls) {
    const el = document.getElementById('s' + idx);
    el.textContent = text;
    el.className = 'status-badge status-' + cls;
  }

  function buildParams(map) {
    const params = {};
    for (const [key, inputId] of Object.entries(map)) {
      const v = document.getElementById(inputId).value.trim();
      if (v) params[key] = v;
    }
    return params;
  }

  function makeUrl(path, params) {
    let base = BASE_INPUT.value.trim().replace(/\/+$/, '');
    if (!base) base = 'http://localhost:7010/sgai-bqzm';
    const url = new URL(base + path);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    return url.toString();
  }

  function doFetch(url) {
    const token = TOKEN_INPUT.value.trim();
    const headers = {};
    if (token) {
      headers['X-Access-Token'] = token;
      headers['Authorization'] = token;
      headers['token'] = token;
    }
    return fetch(url, { headers });
  }

  async function exportExcel(idx, path, paramMap, title) {
    setStatus(idx, '下载中…', 'loading');
    const params = buildParams(paramMap);
    const url = makeUrl(path, params);
    log(`→ ${path}${Object.keys(params).length ? '?' + new URLSearchParams(params).toString() : ''}`);
    try {
      const res = await doFetch(url);
      if (!res.ok) {
        const text = await res.text();
        setStatus(idx, '失败', 'err');
        log(`✗ ${path}  HTTP ${res.status}: ${text.slice(0, 300)}`, 'err');
        return;
      }
      const blob = await res.blob();
      if (blob.size < 1000 && blob.type.includes('json')) {
        // 可能是 JSON 错误响应（如 token 失效）
        const text = await blob.text();
        setStatus(idx, '失败', 'err');
        log(`✗ ${path} 返回 JSON（可能鉴权失败）: ${text.slice(0, 300)}`, 'err');
        return;
      }
      const downloadName = `${title}_${timestamp()}.xlsx`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = downloadName;
      document.body.appendChild(a);
      a.click();
      URL.revokeObjectURL(a.href);
      a.remove();
      setStatus(idx, '成功', 'ok');
      log(`✓ ${path}  下载 ${downloadName}  (${(blob.size / 1024).toFixed(1)} KB)`, 'ok');
    } catch (e) {
      setStatus(idx, '失败', 'err');
      log(`✗ ${path}  请求异常: ${e.message}`, 'err');
    }
  }

  function timestamp() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }

  function exportAll() {
    exportExcel(1, '/bems/lighting/area/export', {relName:'p1_1',areaName:'p1_2',space:'p1_3',districtId:'p1_4'}, '区域列表');
    exportExcel(2, '/bems/lighting/plan/export', {relType:'p2_1',startTime:'p2_2',endTime:'p2_3'}, '计划列表');
    exportExcel(3, '/bems/lighting/scene/export', {sceneName:'p3_1',sceneType:'p3_2',status:'p3_3',groupId:'p3_4'}, '场景列表');
    exportExcel(4, '/bems/lighting/operationLog/export', {logType:'p4_1',operationType:'p4_2',name:'p4_3',startTime:'p4_4',endTime:'p4_5'}, '控制日志');
  }
</script>
</body>
</html>
