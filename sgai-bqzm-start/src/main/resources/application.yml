server:
  port: 7011
spring:
  main:
    allow-circular-references: true
  application:
    name: sgai-bqzm-start
  config:
    import:
      - optional:nacos:jeecg.yaml
      - optional:nacos:bqzm-dev.yaml
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        group: DEFAULT_GROUP
        namespace: public
        username:
        password:
      discovery:
        server-addr: ${spring.cloud.nacos.config.server-addr}
        namespace: public
        username:
        password:
        group: DEFAULT_GROUP

mybatis-plus:
  configuration:
    # 关闭 SQL 与查询结果日志（即使 nacos 远程配置里设置了 StdOutImpl，本地配置优先级更高，也会被覆盖）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
  type-handlers-package: org.jeecg.modules.bems.handler
