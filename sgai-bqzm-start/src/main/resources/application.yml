server:
  port: 7010
spring:
  main:
    allow-circular-references: true
  application:
    name: sgai-bqzm
  config:
    import:
      - optional:nacos:jeecg.yaml
      - optional:nacos:bqzm-dev.yaml
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        group: DEFAULT_GROUP
        namespace: public
        username:
        password:
      discovery:
        server-addr: ${spring.cloud.nacos.config.server-addr}
        namespace: public
        username:
        password:
        group: DEFAULT_GROUP

mybatis-plus:
  configuration:
    # 关闭 SQL 与查询结果日志（即使 nacos 远程配置里设置了 StdOutImpl，本地配置优先级更高，也会被覆盖）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
  type-handlers-package: org.jeecg.modules.bems.handler

# 泛光总控系统 API 配置
yel:
  iot:
    # 总控系统地址，格式：ip:port
    host: 10.61.13.132/yel
    # 登录账号
    username: admin
    # 登录密码
    password: 123456
    # mock 开关：true 时不调用真实接口，返回样例数据（本地看不到总控系统时用）；部署到服务器后改为 false 走真实接口
    mock: true

